# 报关单证一致性核对 规则库
#
# 规则数据与代码分离：替换本文件即可切换规则集版本，无需改动 TypeScript。
#
# 条款引用纪律（由 shared/ruleset.ts 强制校验）：
#   - 每条规则必须写全 document / number / clause / excerpt / kind / source，
#     且 excerpt 必须是逐字摘录，不得改写。
#   - kind: direct                       条款直接规定了所检查的要求
#   - kind: derived-from-principle       条款未直接规定，仅能由原则性条款推论（severity 最多 warn）
#   - kind: institutional-configuration 阈值出自本机构配置（severity 最多 info）
#
# ⚠️⚠️ 本规则库的诚实说明：**excerpt 一律不是引文。**
#   本插件核对的是"报关单证台账"（合同／发票／装箱单／报关单等）之间的字段一致性。
#   其规范载体包括《中华人民共和国海关进出口货物报关单填制规范》（海关总署公告 2019 年第 18 号）
#   与《中华人民共和国海关进出口货物申报管理规定》。
#   ⚠️ **《报关单填制规范》全文已取得并逐条核对**（四十九条 + 相关用语定义，
#   见 rules/evidence/clause-verification.md），核到第三条（商品编号 10 位）、第五条／第六条
#   （日期为 8 位数字 YYYYMMDD，且**申报日期在申报时免予填报**）、第三十九条（币制按《货币代码表》）、
#   第二十四至二十六条（件数、毛重、净重）、第三十八条（总价）等条文。
#   ⚠️ **据此更正了两处表述**：① `CD-003` 的"三位字母"**不是条文措辞**，
#   而是《货币代码表》的形态（该代码表未取得）；② `CD-006` 必须写明
#   **申报日期在申报时免予填报**，故"没填"不应报错。
#   ⚠️ **发文事实（官方公告核实）**：成文日期 **2019-01-22**，**自 2019-02-01 起执行，
#   海关总署 2018 年第 60 号公告同时废止**（引用即错）；
#   **《进（出）境货物备案清单》比照本规范填制**。规范原文读取的是
#   **地方贸促会网站的转载**（官方附件为 `.doc`，抓取工具不支持二进制 Office 文档）。
#   ⚠️ **《申报管理规定》与各类代码表（关区、运输方式、监管方式、货币、国别、港口等）本次均未取得**，
#   这正是本插件**不内置任何代码表**的原因。
#   每条规则的 excerpt 都写明"该条文本次未取得"（因核对对象是台账而非报关单，
#   详见 evidence 报告第五节），kind 保持 derived-from-principle（封顶 warn）。
#   本插件的命中信息只应被读作"这一栏没填 / 这两个编码格式不对 / 同一单号出现两次"，
#   而**不是**"申报不实"或"违反了某条规定"。
#
# ⚠️⚠️ 另一条**必须保留**的边界：**本插件绝不判定申报是否真实、是否构成申报不实、
#   是否影响税款征收、是否应当查验或处罚**。那需要海关依法定职权判断，
#   而且同一份商品在不同归类决定下的编码可能都成立。
#   → 因此本插件只核对**台账自身的齐备、格式与自洽**：
#     关键栏是否填齐、商品编号与币制是否合乎格式、单证编号是否唯一、
#     毛重净重关系是否成立、日期先后是否可能、是否残留模板占位符。
#   → **归类是否正确的判断一律不做。**

plugin: dsh-customs-doc-check
version: "2026.1"

rules:
  - id: CD-001
    title: 单证台账应填写品名与总价
    severity: warn
    basis:
      document: 《中华人民共和国海关进出口货物报关单填制规范》
      number: 海关总署公告 2019 年第 18 号（本次未取得条文）
      clause: 关于报关单各栏填制要求的条款（本次未取得条号）
      excerpt: 该条文本次未取得：核查未获得《报关单填制规范》的逐字原文，本规则库不伪造引文。
      kind: derived-from-principle
      source: http://www.customs.gov.cn/
    params:
      check:
        kind: presenceAny
        fields: [goodsName, amount]
        fix: 补填品名与总价；本条只核对是否填写，不判断申报内容是否真实
    note: >-
      品名与总价是任何一笔申报的**最低可核对信息**：缺其一，后续的数量单价核对、
      币制核对、原产地核对都无从谈起。本次未取得明文条号，故封顶 warn。
      本条只核对"至少填了一个"，**不判断申报内容是否真实、归类是否正确**。

  - id: CD-002
    title: 商品编号应为十位数字
    severity: warn
    basis:
      document: 《中华人民共和国海关进出口货物报关单填制规范》
      number: 海关总署公告 2019 年第 18 号（本次未取得条文）
      clause: 关于商品编号栏的填制要求（本次未取得条号）
      excerpt: 该条文本次未取得：核查未获得《报关单填制规范》的逐字原文，本规则库不伪造引文。
      kind: derived-from-principle
      source: http://www.customs.gov.cn/
    params:
      check:
        kind: pattern
        field: hsCode
        pattern: ^[0-9]{10}$
        fix: 商品编号应写成十位数字；本条的位数出厂值为 10，可按当年税则调整
    note: >-
      商品编号（税则号列）的位数由**当年税则**规定，我国现行税则号列为十位；
      本次未取得明文条号，故封顶 warn。
      本条**只核对位数与字符合法性**，**绝不判断归类是否正确**——
      同一商品的归类在不同归类决定或预裁定下可能不同，那是海关与归类专业人员的判断。
      若当年税则位数调整，改 pattern 即可，无需改代码。

  - id: CD-003
    title: 币制应使用三位字母代码
    severity: warn
    basis:
      document: 《表示货币的代码》
      number: GB/T 12406—2022（表示货币的代码；2022-12-30 发布并实施；全部代替 GB/T 12406—2008（该版名称为「表示货币和资金的代码」）——注意旧版名称含"资金"；修改采用 ISO 4217:2015，非等同采用；条号本次未取得）
      clause: 关于货币代码的规定（本次未取得条号）
      excerpt: 该条文本次未取得：核查未获得 GB/T 12406 的逐字原文，本规则库不伪造引文。
      kind: derived-from-principle
      source: https://openstd.samr.gov.cn/bzgk/std/newGbInfo?hcno=196111BC23AC8BDA0BE2C44F2C32F6CF
    params:
      check:
        kind: pattern
        field: currency
        pattern: ^[A-Z]{3}$
        fix: 币制应写成三位大写字母代码（如 USD、EUR、JPY、HKD）
    note: >-
      本条的依据是**《报关单填制规范》第三十九条**（据逐字核对，见 rules/evidence/clause-verification.md）：
      原文「**按海关规定的《货币代码表》选择相应的货币名称及代码填报**」。
      ⚠️ **条文并未规定"三位字母"** —— 三位字母（ISO 4217 形式）是《货币代码表》的**实际形态**，
      而**该代码表本次未取得**。因此本条核对的"三位大写字母"是**形态核对**，
      **不是条文措辞的直接要求**，故封顶 warn、kind 保持 derived-from-principle。
      **特别提示**：人民币在 ISO 4217 中的代码是 **CNY**，而报关实务中 CNY 与 RMB 两种写法并存；
      本规则库**不替使用方规定该用哪个**——若本机构一律用某个写法，把 pattern 收紧即可。
      本条**不判断币制选择是否正确**，那取决于实际结算币别。

  - id: CD-004
    title: 单证编号应在本台账内唯一
    severity: warn
    basis:
      document: 《中华人民共和国海关进出口货物申报管理规定》
      number: 海关总署令（现行令号本次未核实）
      clause: 关于单证编号与申报凭证的条款（本次未取得条号）
      excerpt: 该条文本次未取得：核查未获得该规定的逐字原文，本规则库不伪造引文。
      kind: derived-from-principle
      source: http://www.customs.gov.cn/
    params:
      check:
        kind: unique
        field: docNo
    note: >-
      单证编号唯一是"同一份单证只被登记一次"的**前提条件**：编号重复会让人无法判断
      到底是重复登记，还是两份不同单证被错编成同一号。本次未取得明文条号，故封顶 warn。
      比较时忽略空白字符。命中通常意味着重复登记或编号抄错，需人工确认。

  - id: CD-005
    title: 毛重应不小于净重
    severity: warn
    basis:
      document: 《中华人民共和国海关进出口货物报关单填制规范》
      number: 海关总署公告 2019 年第 18 号（本次未取得条文）
      clause: 关于毛重与净重栏的填制要求（本次未取得条号）
      excerpt: 该条文本次未取得：核查未获得《报关单填制规范》的逐字原文，本规则库不伪造引文。
      kind: derived-from-principle
      source: http://www.customs.gov.cn/
    params:
      check:
        kind: fieldComparison
        leftField: grossWeight
        rightField: netWeight
        relation: gte
    note: >-
      毛重包含包装、净重不含，故**毛重不小于净重**是这两个字段的语义前提；
      本次未取得明文条号，故封顶 warn。
      本条只做数值比较（可带单位，如 12.5KGS）；两个字段缺其一即进 skipped。
      命中通常意味着两栏填反或抄错，需人工确认——**不判断重量申报是否真实**。

  - id: CD-006
    title: 申报日期应可解析，且不应晚于核对日
    severity: warn
    basis:
      document: 《中华人民共和国海关进出口货物申报管理规定》
      number: 海关总署令（现行令号本次未核实）
      clause: 关于申报日期的条款（本次未取得条号）
      excerpt: 该条文本次未取得：核查未获得该规定的逐字原文，本规则库不伪造引文。
      kind: derived-from-principle
      source: http://www.customs.gov.cn/
    params:
      check:
        kind: date
        field: declaredAt
        notAfter: today
    note: >-
      申报日期可解析是台账能被程序处理的前提；不应晚于核对日，
      是"这是已发生的申报"的**自洽条件**。
      依据说明（据《报关单填制规范》**第五条、第六条**逐字核对）：
      条文原文「**进出口日期为 8 位数字，顺序为年（4 位）、月（2 位）、日（2 位）**」、
      「**申报日期为 8 位数字，顺序为年（4 位）、月（2 位）、日（2 位）**」。
      ⚠️ **必须注意的例外**：第六条文末明确「**本栏目在申报时免予填报**」——
      即**申报方在申报时并不填申报日期**（由海关计算机系统在接受申报数据时记录）。
      ⇒ **台账里没有申报日期是正常的，本条不应因"没填"而报错**；
      它只在"填了的话"核对可解析性与先后。
      日期无法解析时会单独报出，**不会静默跳过**。
      本条**不判断申报是否在法定期限内**——那取决于运输方式与具体规定。

  - id: CD-007
    title: 台账关键栏不应残留未替换的占位符
    severity: warn
    basis:
      document: 《中华人民共和国海关进出口货物报关单填制规范》
      number: 海关总署公告 2019 年第 18 号（本次未取得条文）
      clause: 关于各栏应据实填制的条款（本次未取得条号）
      excerpt: 该条文本次未取得：核查未获得《报关单填制规范》的逐字原文，本规则库不伪造引文。
      kind: derived-from-principle
      source: http://www.customs.gov.cn/
    params:
      check:
        kind: containsAny
        field: goodsName
        terms: ['【', '】', '{{', '}}', 'XXX', 'xxx', '待填', '待补充', 'TBD', 'todo', '示例']
        fix: 品名应填写实际货物名称；残留占位符说明台账是照模板抄的
    note: >-
      台账若直接照抄模板，品名栏常留下【】、{{}}、XXX、待填、TBD 之类占位符。
      这会让人误以为已经核对了实际单证——**这是台账类工具最危险的失效方式**。
      本次未取得明文条号，故封顶 warn。terms 可按本机构模板调整。

disabled: []
